<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Neon Cyan & Violet Glow Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Neon Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg)" />

  <!-- Ambient Light Behind Mascot -->
  <ellipse cx="400" cy="400" rx="220" ry="240" fill="#00E5FF" opacity="0.08" filter="url(#ambientGlow)" />
  <ellipse cx="400" cy="350" rx="180" ry="180" fill="#8B5CF6" opacity="0.08" filter="url(#ambientGlow)" />

  <!-- HEIMDALL CYBERPUNK HEAD GROUP -->
  <g filter="url(#neonBlur)">
    <!-- Base Head Silhouette -->
    <path d="M 210 280 L 250 120 L 340 240 L 400 200 L 460 240 L 550 120 L 590 280 L 560 480 L 400 630 L 240 480 Z"
          fill="#0D1322" stroke="url(#neonCyanPurple)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Left Ear Circuits -->
    <path d="M 265 160 L 315 250 L 285 330" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" />
    <path d="M 240 220 L 280 280" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <circle cx="265" cy="160" r="6" fill="#00E5FF" />
    <circle cx="285" cy="330" r="5" fill="#38BDF8" />
    <circle cx="240" cy="220" r="4" fill="#00E5FF" />

    <!-- Right Ear Circuits -->
    <path d="M 535 160 L 485 250 L 515 330" fill="none" stroke="#C084FC" stroke-width="4" stroke-linecap="round" />
    <path d="M 560 220 L 520 280" fill="none" stroke="#C084FC" stroke-width="3" stroke-linecap="round" />
    <circle cx="535" cy="160" r="6" fill="#C084FC" />
    <circle cx="515" cy="330" r="5" fill="#A855F7" />
    <circle cx="560" cy="220" r="4" fill="#C084FC" />

    <!-- Blue Heeler Mask Patches (Dark Cheeks) -->
    <path d="M 240 310 L 365 310 L 365 470 L 275 470 Z" fill="#090E1A" stroke="#3B82F6" stroke-width="3" opacity="0.9" />
    <path d="M 560 310 L 435 310 L 435 470 L 525 470 Z" fill="#090E1A" stroke="#8B5CF6" stroke-width="3" opacity="0.9" />

    <!-- Central White Forehead Blaze (Heimdall's Signature) -->
    <polygon points="400,200 365,440 435,440" fill="#FFFFFF" opacity="0.98" filter="drop-shadow(0 0 8px rgba(255,255,255,0.8))" />

    <!-- Tan Eyebrow Dots -->
    <ellipse cx="320" cy="345" rx="20" ry="13" fill="#D97706" />
    <ellipse cx="480" cy="345" rx="20" ry="13" fill="#D97706" />
    <circle cx="320" cy="345" r="5" fill="#F59E0B" />
    <circle cx="480" cy="345" r="5" fill="#F59E0B" />

    <!-- Glowing Cyberpunk Eyes -->
    <circle cx="320" cy="395" r="14" fill="#0B0F19" stroke="#00E5FF" stroke-width="4" />
    <circle cx="480" cy="395" r="14" fill="#0B0F19" stroke="#00E5FF" stroke-width="4" />
    <circle cx="320" cy="395" r="8" fill="#00E5FF" />
    <circle cx="480" cy="395" r="8" fill="#00E5FF" />
    <circle cx="323" cy="392" r="3" fill="#FFFFFF" />
    <circle cx="483" cy="392" r="3" fill="#FFFFFF" />

    <!-- Muzzle & Nose Structure -->
    <path d="M 335 470 L 400 440 L 465 470 L 450 540 L 400 575 L 350 540 Z" fill="#111827" stroke="#00E5FF" stroke-width="5" stroke-linejoin="round" />
    <!-- Nose Core -->
    <path d="M 370 495 Q 400 480 430 495 Q 400 535 370 495 Z" fill="#00E5FF" filter="drop-shadow(0 0 6px #00E5FF)" />

    <!-- Lower Jaw & Collar Circuit Nodes -->
    <path d="M 330 570 L 400 620 L 470 570" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" />
    <rect x="375" y="615" width="50" height="22" rx="11" fill="#0B0F19" stroke="#00E5FF" stroke-width="4" />
    <circle cx="400" cy="626" r="4" fill="#00E5FF" />
  </g>
</svg>
