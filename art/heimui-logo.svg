<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161D2F" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>

    <!-- Neon Cyan to Violet Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.25" />

  <!-- HEIMDALL CYBERPUNK HEAD GEOMETRY -->
  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Outer Head Silhouette & Ears -->
    <path d="M 120 180 L 150 70 L 210 160 L 256 130 L 302 160 L 362 70 L 392 180 L 370 340 L 256 430 L 142 340 Z"
          fill="#0D1322" stroke="url(#neonGrad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Inner Ear Neon Circuits (Left) -->
    <path d="M 160 100 L 195 165 L 175 220" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <circle cx="160" cy="100" r="4" fill="#00E5FF" />
    <circle cx="175" cy="220" r="4" fill="#A855F7" />

    <!-- Inner Ear Neon Circuits (Right) -->
    <path d="M 352 100 L 317 165 L 337 220" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <circle cx="352" cy="100" r="4" fill="#A855F7" />
    <circle cx="337" cy="220" r="4" fill="#00E5FF" />

    <!-- Blue Heeler Mask (Left Dark Patch) -->
    <path d="M 142 200 L 235 200 L 235 310 L 170 310 Z" fill="#090D17" stroke="#4F46E5" stroke-width="2" opacity="0.8" />

    <!-- Blue Heeler Mask (Right Dark Patch) -->
    <path d="M 370 200 L 277 200 L 277 310 L 342 310 Z" fill="#090D17" stroke="#4F46E5" stroke-width="2" opacity="0.8" />

    <!-- White Center Forehead Blaze -->
    <polygon points="256,130 235,290 277,290" fill="#FFFFFF" opacity="0.95" />

    <!-- Tan Eyebrow Dots (Heimdall's Signature) -->
    <ellipse cx="205" cy="225" rx="14" ry="9" fill="#D97706" />
    <ellipse cx="307" cy="225" rx="14" ry="9" fill="#D97706" />

    <!-- Cyberpunk Eyes -->
    <circle cx="205" cy="255" r="8" fill="#00E5FF" />
    <circle cx="307" cy="255" r="8" fill="#00E5FF" />
    <circle cx="205" cy="255" r="3" fill="#FFFFFF" />
    <circle cx="307" cy="255" r="3" fill="#FFFFFF" />

    <!-- Muzzle / Nose Wireframe -->
    <path d="M 215 320 L 256 295 L 297 320 L 285 365 L 256 385 L 227 365 Z" fill="#111827" stroke="#00E5FF" stroke-width="4" />
    <!-- Nose Core -->
    <path d="M 238 335 Q 256 325 274 335 Q 256 360 238 335 Z" fill="#00E5FF" />

    <!-- Jaw & Collar Circuit Nodes -->
    <path d="M 210 395 L 256 425 L 302 395" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <rect x="240" y="420" width="32" height="14" rx="7" fill="none" stroke="#00E5FF" stroke-width="3" />
  </g>
</svg>
