name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The payloads are the contract between this app and whoever writes screens. A malformed one
  # only surfaces at runtime otherwise — on a device, to a user.
  payloads:
    name: Payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valid JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob("sdui/**/*.json", recursive=True))
          bad = []
          for f in files:
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(files)} payloads OK")
          PY

      # Only these carry padding. A `padding` on anything else is silently ignored at runtime,
      # which looks like the SDK dropped it rather than like the payload asked for the impossible.
      - name: Padding is on a component that supports it
        run: |
          python3 - <<'PY'
          import glob, json, sys
          ALLOWED = {"container", "card", "lazy_column", "lazy_row", "box"}
          bad = []
          def walk(node, path, out):
              if isinstance(node, dict):
                  if "padding" in node and node.get("type") not in ALLOWED:
                      out.append(f"{path}: '{node.get('type')}' (id={node.get('id')})")
                  for key in ("children", "items"):
                      for i, child in enumerate(node.get(key) or []):
                          walk(child, path, out)
                  if "child" in node:
                      walk(node["child"], path, out)
          for f in sorted(glob.glob("sdui/**/*.json", recursive=True)):
              walk(json.load(open(f)).get("root", {}), f, bad)
          if bad:
              print("padding on components that ignore it:")
              print("\n".join("  " + b for b in bad)); sys.exit(1)
          print("padding placement OK")
          PY
